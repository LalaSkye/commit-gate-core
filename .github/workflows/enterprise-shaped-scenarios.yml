name: enterprise-shaped-scenarios

# QUARANTINED 2026-05-24 — see issue #22
# enterprise-execution-readiness/ is not part of the v0.1.0 proof surface.
# This workflow is restricted to manual dispatch pending the dataclass
# collection fix in enterprise-execution-readiness/adapters/replay_ledger.py.
on:
  workflow_dispatch:

jobs:
  esp-001:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run ESP-001 downstream non-call test
        run: python -m pytest enterprise-execution-readiness/tests -v

      - name: Run ESP-001 synthetic trace harness
        run: python enterprise-execution-readiness/run_scenario_001.py
