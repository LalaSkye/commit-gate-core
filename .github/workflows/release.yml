name: Release

on:
  push:
    tags:
      - "v0.2.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v0.2.0"

          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Ref mismatch: expected tag ${expected_tag}, got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          package_version="$(python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"

          if [[ "v${package_version}" != "${expected_tag}" ]]; then
            echo "Package version mismatch: expected ${expected_tag}, got v${package_version}" >&2
            exit 1
          fi

          first_line="$(head -n 1 RELEASE_NOTES.md)"
          expected_heading="# commit-gate-core ${expected_tag}"
          if [[ "${first_line}" != "${expected_heading}" ]]; then
            echo "Release notes mismatch: expected '${expected_heading}', got '${first_line}'" >&2
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install --upgrade build pytest

      - name: Run repository tests
        run: python -m pytest -q

      - name: Build wheel and source archive
        run: python -m build

      - name: Verify built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "${RUNNER_TEMP}"
          python - <<'PY'
          from commit_gate_core import CommitGate, __version__
          from commit_gate_core.scenario_runner import run_scenario_001

          assert CommitGate.__name__ == "CommitGate"
          assert __version__ == "0.2.0"
          assert run_scenario_001()["downstream_send"] is False
          print("Release package: PASS")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "commit-gate-core ${GITHUB_REF_NAME}"
          --notes-file RELEASE_NOTES.md
