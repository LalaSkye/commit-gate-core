name: Bootstrap v0.1.0 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-v0.1.0.yml"

permissions:
  contents: write

env:
  TARGET_SHA: 47eed540e669791ad7fa220dbb1c4aa2d124df44
  RELEASE_TAG: v0.1.0

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the frozen release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade build pytest

      - name: Run repository tests
        run: python -m pytest tests -q

      - name: Build wheel and source archive
        run: python -m build

      - name: Verify built wheel outside the checkout
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "${RUNNER_TEMP}"
          python - <<'PY'
          from commit_gate_core import CommitGate, __version__
          from commit_gate_core.scenario_runner import run_scenario_001

          assert CommitGate.__name__ == "CommitGate"
          assert __version__ == "0.1.0"
          assert run_scenario_001()["downstream_send"] is False
          print("Release package: PASS")
          PY

      - name: Create the frozen tag if absent
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" --force
            test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${TARGET_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" "${TARGET_SHA}" -m "commit-gate-core ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish or repair the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --verify-tag \
              --title "commit-gate-core ${RELEASE_TAG}" \
              --notes-file RELEASE_NOTES.md
          fi
